{% extends 'base.html' %}

{% block title %} My Orders - Modern E-Commerce {% endblock %}

{% block contentblock %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="fw-bold" style="font-size: 2rem; background: linear-gradient(45deg, var(--primary), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">My Orders</h2>
        <p class="text-muted">View your order history and status.</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-12">
        <div class="product-card" style="padding: 1.5rem; display: block; height: auto;">
            <div id="orders-container">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadOrders();
});

function loadOrders() {
    fetch('/api/orders/', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`API Error: ${response.status} ${response.statusText}`);
        }
        return response.json();
    })
    .then(data => {
        const container = document.getElementById('orders-container');
        container.innerHTML = '';
        
        // Handle DRF pagination: response is {count, results:[]} OR a plain array
        const orders = Array.isArray(data) ? data : (data.results || []);
        
        if (orders.length === 0) {
            container.innerHTML = '<div class="text-center py-5"><h5 class="text-muted">You have no orders yet.</h5><a href="/" class="btn-primary-custom mt-3" style="display:inline-block; width:auto;">Start Shopping</a></div>';
            return;
        }

        let html = '';
        orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleString();
            let statusBadgeClass = 'bg-warning text-dark';
            if (order.status === 'completed') statusBadgeClass = 'bg-success';
            if (order.status === 'cancelled') statusBadgeClass = 'bg-danger';
            
            let payButton = '';
            if (order.status === 'pending' && order.total_amount > 0) {
                payButton = `
                <div class="mt-3">
                    <button class="btn btn-sm text-white" style="background-color: #5C2D91; border-radius: 6px;" onclick="initKhalti(${order.id}, ${order.total_amount})">
                        Pay with Khalti
                    </button>
                </div>
                `;
            }
            
            html += `
            <div class="mb-4 pb-4" style="border-bottom: 1px solid rgba(0,0,0,0.05);">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Order #${order.id}</h5>
                    <span class="badge ${statusBadgeClass} px-3 py-2 text-uppercase" style="border-radius: 8px;">${order.status}</span>
                </div>
                <div class="text-muted small mb-3">Placed on: ${date}</div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="fw-bold small text-muted text-uppercase mb-1">Shipping To:</div>
                        <div>${order.shipping_address}</div>
                        <div class="mt-2 text-muted small"><span class="fw-bold">Method:</span> ${order.shipping_method}</div>
                        ${payButton}
                    </div>
                    <div class="col-md-6">
                        <div class="fw-bold small text-muted text-uppercase mb-2">Order Items:</div>
                        <ul class="list-unstyled mb-0">
            `;
            
            order.order_items.forEach(item => {
                html += `
                    <li class="d-flex justify-content-between align-items-center mb-2">
                        <span>${item.product.name} <span class="text-muted">x${item.quantity}</span></span>
                        <span class="fw-bold">$${item.price}</span>
                    </li>
                `;
            });
            
            html += `
                        </ul>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-muted">Total:</span>
                            <span class="fw-bold fs-5 text-primary">$${order.total_amount}</span>
                        </div>
                    </div>
                </div>
            </div>
            `;
        });
        
        container.innerHTML = html;
    })
    .catch(error => {
        console.error('Error loading orders:', error);
        document.getElementById('orders-container').innerHTML = `<div class="text-danger text-center">Failed to load orders: ${error.message}. Check the browser console for details.</div>`;
    });
}

function initKhalti(orderId, amount) {
    // In a real application, you would load the KhaltiCheckout JS library
    // and initialize it with your public key, then call checkout.show()
    
    // For this implementation, we simulate the Khalti popup success response
    if(confirm('This simulates the Khalti Payment Gateway. Click OK to simulate a successful payment of $' + amount + ' for Order #' + orderId + '.')) {
        
        const mockToken = 'test_token_' + Math.random().toString(36).substr(2, 9);
        
        fetch(`/api/orders/${orderId}/verify_khalti/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                'token': mockToken,
                'amount': amount
            })
        })
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                alert('Payment Successful!');
                loadOrders(); // Reload the UI to show the 'completed' badge
            } else {
                alert(data.error || 'Payment verification failed.');
            }
        })
        .catch(err => console.error(err));
    }
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
