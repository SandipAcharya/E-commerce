{% extends 'base.html' %}

{% block title %} Your Cart - Modern E-Commerce {% endblock %}

{% block contentblock %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="fw-bold" style="font-size: 2rem; background: linear-gradient(45deg, var(--primary), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Your Shopping Cart</h2>
        <p class="text-muted">Review your items and proceed to checkout.</p>
    </div>
</div>

<div class="row g-4">
    <!-- Cart Items Column -->
    <div class="col-12 col-lg-8">
        <div class="product-card" style="padding: 1.5rem; display: block; height: auto;">
            <div id="cart-items-container">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Summary & Checkout Column -->
    <div class="col-12 col-lg-4">
        <div class="product-card" style="padding: 1.5rem; display: block; height: auto;">
            <h4 class="fw-bold mb-4">Order Summary</h4>
            <hr>
            <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Subtotal</span>
                <span class="fw-bold" id="cart-subtotal">$0.00</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Shipping</span>
                <span class="text-success">Free</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-4">
                <span class="fw-bold fs-5">Total</span>
                <span class="fw-bold fs-5" id="cart-total" style="color: var(--primary);">$0.00</span>
            </div>

            <h5 class="fw-bold mb-3 mt-4">Shipping Details</h5>
            <form id="checkout-form">
                <div class="mb-3">
                    <label class="form-label text-muted">Full Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Shipping Address</label>
                    <textarea class="form-control" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted">Payment Method</label>
                    <select class="form-select" id="payment-method">
                        <option value="khalti">Khalti</option>
                        <option value="esewa">eSewa</option>
                        <option value="cashondelivery">Cash on Delivery</option>
                    </select>
                </div>
                
                <button type="button" class="btn-primary-custom mt-2 py-3 fs-5" onclick="processCheckout()">
                    Proceed to Checkout
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    loadCart();
});

function loadCart() {
    fetch('/api/cart/my_cart/', {
        method: 'GET',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        }
    })
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('cart-items-container');
        container.innerHTML = ''; // Clear loading spinner
        
        if (!data.items || data.items.length === 0) {
            container.innerHTML = '<div class="text-center py-5"><h5 class="text-muted">Your cart is empty.</h5><a href="/" class="btn-primary-custom mt-3" style="display:inline-block; width:auto;">Continue Shopping</a></div>';
            return;
        }

        let html = '';
        data.items.forEach(item => {
            const product = item.product;
            const imgUrl = (product.product_image && product.product_image.length > 0) ? product.product_image[0].image_name : '';
            
            html += `
            <div class="d-flex align-items-center mb-4 pb-4 position-relative" style="border-bottom: 1px solid rgba(0,0,0,0.05);">
                <div style="width: 100px; height: 100px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-right: 1.5rem; border: 1px solid rgba(0,0,0,0.05);">
                    ${imgUrl ? `<img src="${imgUrl}" style="max-width: 100%; max-height: 100%; object-fit: contain;">` : '<span class="text-muted small">No Image</span>'}
                </div>
                <div class="flex-grow-1">
                    <h6 class="fw-bold mb-1">${product.name}</h6>
                    <div class="text-muted small mb-2">${product.category ? product.category.name : 'Uncategorized'}</div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="fw-bold" style="color: var(--primary);">$${product.price}</div>
                        <div class="d-flex align-items-center">
                            <span class="text-muted me-3">Qty: ${item.quantity}</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="removeCartItem(${item.id})">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                  <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z"/>
                                  <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            `;
        });
        
        container.innerHTML = html;
        document.getElementById('cart-subtotal').innerText = '$' + data.total_price;
        document.getElementById('cart-total').innerText = '$' + data.total_price;
    })
    .catch(error => {
        console.error('Error loading cart:', error);
        document.getElementById('cart-items-container').innerHTML = '<div class="text-danger text-center">Failed to load cart.</div>';
    });
}

function removeCartItem(cartItemId) {
    if(!confirm("Are you sure you want to remove this item?")) return;
    
    fetch('/api/cart/remove_item/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            'cart_item_id': cartItemId
        })
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            loadCart(); // Reload the cart to update UI and totals
        } else {
            alert('Error removing item.');
        }
    })
    .catch(error => console.error('Error:', error));
}

function processCheckout() {
    const address = document.querySelector('textarea').value;
    if (!address) {
        alert('Please provide a shipping address.');
        return;
    }
    
    const paymentMethod = document.getElementById('payment-method').value;
    
    fetch('/api/cart/checkout/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            'shipping_address': address,
            'payment_method': paymentMethod
        })
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            alert('Order placed successfully! Order ID: ' + data.order_id);
            window.location.href = "{% url 'index' %}";
        } else {
            alert(data.error || 'Error processing checkout.');
        }
    })
    .catch(error => console.error('Error:', error));
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
